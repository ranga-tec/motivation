services:
  - type: web
    name: poms-api
    runtime: docker
    plan: free
    region: singapore
    dockerContext: ./POMS
    dockerfilePath: ./POMS/src/Poms.Api/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: DATABASE_URL
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: FileStorage__RootPath
        value: /tmp/poms-storage
      - key: SeedDemoUsers
        value: "false"
      - key: BootstrapAdmin__Email
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
