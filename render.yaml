services:
  - type: web
    name: poms-motivation
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/ranga-tec/motivation
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: UsePostgreSQL
        value: "false"
      - key: UseSQLite
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/tmp/poms-local.db
      - key: FileStorage__RootPath
        value: /tmp/poms-storage
      - key: DataProtection__KeysPath
        value: /tmp/poms-data-protection-keys
      - key: Security__ForceHttps
        value: "false"
