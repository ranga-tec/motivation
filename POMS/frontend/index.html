<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b63ce" />
    <meta name="description" content="Exceed Lanka Prosthetic & Orthotic Data Management System" />
    <title>POMS · Exceed Lanka</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem('poms.theme') || 'light';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
        document.documentElement.dataset.density = localStorage.getItem('poms.density') || 'comfortable';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
