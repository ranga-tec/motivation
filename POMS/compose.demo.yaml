services:
  api:
    build:
      context: .
      dockerfile: src/Poms.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      UseSQLite: "true"
      ConnectionStrings__DefaultConnection: Data Source=/app/data/poms.db
      ApiAuthentication__Authority: https://identity.example.invalid
      ApiAuthentication__Audience: poms-api
      Cors__AllowedOrigins__0: http://localhost:8080
      SeedDemoUsers: "true"
    volumes:
      - poms_demo_database:/app/data
      - poms_demo_files:/app/storage
      - poms_demo_keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "8081:8080"

  frontend:
    build:
      context: frontend
      target: demo
    depends_on:
      - api
    ports:
      - "8080:5173"

volumes:
  poms_demo_database:
  poms_demo_files:
  poms_demo_keys:

