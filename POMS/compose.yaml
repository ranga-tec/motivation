services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: poms
      POSTGRES_USER: poms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - poms_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poms -d poms"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Poms.Api/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: postgresql://poms:${POSTGRES_PASSWORD}@database:5432/poms
      ApiAuthentication__Authority: ${OIDC_AUTHORITY:?Set OIDC_AUTHORITY}
      ApiAuthentication__Audience: ${OIDC_AUDIENCE:-poms-api}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:?Set FRONTEND_URL}
      FileStorage__RootPath: /app/storage
      SeedDemoUsers: "false"
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - poms_files:/app/storage
      - poms_keys:/home/app/.aspnet/DataProtection-Keys
    ports:
      - "${API_PORT:-8081}:8080"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: ${API_PUBLIC_URL:?Set API_PUBLIC_URL}
        VITE_OIDC_AUTHORITY: ${OIDC_AUTHORITY}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile roles poms-api}
        VITE_OIDC_REDIRECT_URI: ${FRONTEND_URL}/auth/callback
        VITE_OIDC_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_URL}/signin
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:8080"

volumes:
  poms_database:
  poms_files:
  poms_keys:
